<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>通知カンバン</title>
<style>
  :root {
    --bg: #f4f6f8; --panel: #ffffff; --border: #e2e6ea; --line: #eef1f4;
    --text: #14181d; --muted: #6b7480; --faint: #9aa3ad;
    --accent: #2563eb; --danger: #c0261c; --ok: #15803d; --soft: #f0f3f7;
    --high: #d92d20; --normal: #2563eb; --low: #8a94a0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121519; --panel: #1b1f25; --border: #2c333b; --line: #242a31;
      --text: #e8eaed; --muted: #9aa3ad; --faint: #6f7883;
      --accent: #6ba5fb; --danger: #f8746a; --ok: #4ade80; --soft: #222831;
      --high: #f8746a; --normal: #6ba5fb; --low: #7d868f;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 13px/1.65 "Segoe UI", "Yu Gothic UI", system-ui, sans-serif;
  }

  /* ---------- ヘッダ ---------- */
  header {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 8px 16px; border-bottom: 1px solid var(--border); background: var(--panel);
    position: sticky; top: 0; z-index: 5;
  }
  header h1 { font-size: 14px; margin: 0; font-weight: 650; letter-spacing: .01em; }
  .spacer { flex: 1; }
  button {
    font: inherit; font-size: 12px; padding: 5px 11px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--panel); color: var(--text); cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.primary:hover:not(:disabled) { color: #fff; filter: brightness(1.08); }
  button.quiet { border-color: transparent; color: var(--muted); }
  button.danger { color: var(--danger); border-color: transparent; }
  button.danger:hover:not(:disabled) { border-color: var(--danger); color: var(--danger); }
  /* 列の見出しに出す掃除ボタン。押し間違えたくないので、赤くなるのはホバー時だけ */
  button.sweep { padding: 1px 7px; font-size: 10.5px; border-color: transparent; color: var(--faint); }
  button.sweep:hover:not(:disabled) { border-color: var(--danger); color: var(--danger); }

  #worker {
    display: flex; align-items: center; gap: 7px; padding: 3px 11px;
    border: 1px solid var(--border); border-radius: 20px; background: var(--soft); max-width: 44vw;
  }
  #worker .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); flex: none; }
  #worker.working { border-color: var(--ok); }
  #worker.working .dot { background: var(--ok); animation: pulse 1.2s ease-in-out infinite; }
  #worker.idle .dot { background: var(--accent); }
  #worker.waiting { border-color: var(--high); }
  #worker.waiting .dot { background: var(--high); animation: pulse 1.2s ease-in-out infinite; }
  #worker.waiting .txt { color: var(--high); font-weight: 600; }
  #worker.error .dot, #worker.stopped .dot { background: var(--danger); }
  #worker .txt { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 11.5px; color: var(--muted); }
  #worker.working .txt { color: var(--text); }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .2; } }

  #warn {
    margin: 10px 16px -6px; padding: 8px 12px; border-radius: 6px;
    border-left: 3px solid var(--danger); background: var(--panel);
    color: var(--danger); font-size: 12px;
  }
  /* 収集とワーカーは別々に落ちるので、両方出ることがある */
  #warn div + div { margin-top: 4px; }

  /* 承認待ち。作業が止まっているので最も目立たせる */
  #perm { margin: 12px 16px -4px; }
  .ask {
    border: 1px solid var(--high); border-left-width: 3px; border-radius: 8px;
    background: var(--panel); padding: 11px 13px; margin-bottom: 8px;
  }
  .ask .hd { font-size: 12.5px; font-weight: 650; color: var(--high); }
  .ask .sub { font-size: 11px; color: var(--muted); margin-top: 1px; }
  .ask pre { margin: 8px 0 9px; max-height: 220px; overflow: auto; font-size: 12px; background: var(--soft); }
  .grants {
    display: flex; gap: 7px; flex-wrap: wrap; align-items: center;
    font-size: 11px; color: var(--muted); padding: 2px 2px 6px;
  }
  .grants .g {
    display: inline-flex; align-items: center; gap: 5px; padding: 2px 6px;
    border: 1px solid var(--border); border-radius: 12px; background: var(--panel);
  }
  .grants .g button { padding: 0 4px; font-size: 11px; border: none; background: none; color: var(--muted); }
  .grants .g button:hover { color: var(--danger); }
  #yoloBtn.on { border-color: var(--high); color: var(--high); font-weight: 650; }

  /* ---------- ボード ---------- */
  #board { display: flex; gap: 10px; padding: 16px; align-items: flex-start; overflow-x: auto; }
  .col {
    flex: 0 0 264px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; display: flex; flex-direction: column; max-height: calc(100vh - 96px);
  }
  .col > .head { padding: 8px 12px 7px; border-bottom: 1px solid var(--line); }
  .col > .head .top { display: flex; align-items: center; gap: 6px; }
  .col .name { font-size: 12px; font-weight: 650; flex: 1; }
  .col .count { color: var(--faint); font-weight: 400; }
  .col .hint { display: block; font-size: 10.5px; color: var(--faint); margin-top: 1px; }
  /* 見るべき列だけ色を持たせ、済んだ列は沈める */
  .col.act .name { color: var(--accent); }
  .col.act { border-color: color-mix(in srgb, var(--accent) 35%, var(--border)); }
  .col.done-ish { opacity: .72; }
  .col .list { padding: 7px; overflow-y: auto; min-height: 52px; flex: 1; }
  .col.over { outline: 2px solid var(--accent); outline-offset: -2px; }

  .card {
    background: var(--panel); border: 1px solid var(--border); border-left: 3px solid var(--border);
    border-radius: 5px; padding: 8px 10px; margin-bottom: 7px; cursor: grab;
  }
  .card:hover { border-color: var(--accent); border-left-color: var(--accent); }
  .card.u-high { border-left-color: var(--high); }
  .card.u-normal { border-left-color: var(--normal); }
  .card.active { border-color: var(--ok); border-left-color: var(--ok); background: color-mix(in srgb, var(--ok) 6%, var(--panel)); }
  .card .t { font-size: 13.5px; font-weight: 620; line-height: 1.45; word-break: break-word; }
  .card .s {
    color: var(--muted); font-size: 11.5px; line-height: 1.5; margin-top: 3px; word-break: break-word;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .card .foot {
    margin-top: 7px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    font-size: 10.5px; color: var(--faint);
  }
  .card .foot .u-high { color: var(--high); font-weight: 600; }
  .card .foot .files { color: var(--ok); }
  .card .warnflag { color: var(--danger); font-weight: 600; cursor: help; }
  .card .now { margin-top: 6px; font-size: 11px; color: var(--ok); font-weight: 600; }
  /* 元の会話へ戻る導線。カードでは末尾に小さく、ドロワーでは見出しの隣に置く */
  a.open {
    color: var(--accent); text-decoration: none; white-space: nowrap;
    border: 1px solid transparent; border-radius: 5px;
  }
  a.open:hover { text-decoration: underline; }
  .card .foot a.open { margin-left: auto; font-size: 10.5px; }
  #drawer a.open.btn {
    font-size: 12px; padding: 5px 11px; border-color: var(--border); background: var(--panel);
  }
  #drawer a.open.btn:hover { border-color: var(--accent); text-decoration: none; }

  /* ---------- ドロワー ---------- */
  #drawer {
    position: fixed; top: 0; right: 0; width: min(520px, 96vw); height: 100%;
    background: var(--panel); border-left: 1px solid var(--border);
    overflow-y: auto; z-index: 10; box-shadow: -10px 0 28px rgba(0,0,0,.13);
  }
  #drawer .pad { padding: 14px 18px 40px; }
  #drawer h3 { margin: 0; font-size: 17px; line-height: 1.4; font-weight: 650; word-break: break-word; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 7px; font-size: 11px; color: var(--muted); }
  .chip { cursor: help; }
  .chip b { font-weight: 600; color: var(--text); }
  .chip.hi b { color: var(--high); }
  .chip.warn { color: var(--danger); font-weight: 600; }

  .lead { margin-top: 14px; font-size: 13.5px; line-height: 1.7; }

  /* 主役: 成果物と自分の下書き */
  .primary {
    margin-top: 16px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--soft); padding: 12px;
  }
  .primary > .cap { font-size: 11px; font-weight: 650; color: var(--muted); margin-bottom: 8px; }

  .file {
    display: flex; align-items: center; gap: 8px; padding: 7px 9px; margin-bottom: 6px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 6px; font-size: 12px;
  }
  .file .nm { font-weight: 600; word-break: break-all; flex: 1; }
  .file .sz { color: var(--faint); font-size: 11px; white-space: nowrap; }

  details { margin-top: 8px; border-top: 1px solid var(--line); }
  details > summary {
    cursor: pointer; list-style: none; padding: 9px 2px; font-size: 12px;
    color: var(--muted); display: flex; align-items: center; gap: 7px; user-select: none;
  }
  details > summary::-webkit-details-marker { display: none; }
  details > summary::before {
    content: '▸'; font-size: 10px; color: var(--faint); transition: transform .12s;
  }
  details[open] > summary::before { transform: rotate(90deg); }
  details > summary:hover { color: var(--accent); }
  details > summary .n { color: var(--faint); font-weight: 400; }
  details .body { padding: 2px 2px 12px; }

  pre {
    white-space: pre-wrap; word-break: break-word; background: var(--panel);
    border: 1px solid var(--border); border-radius: 6px; padding: 9px 10px; margin: 0 0 7px;
    font: inherit; font-size: 12.5px; line-height: 1.65;
  }
  textarea {
    width: 100%; font: inherit; font-size: 12.5px; padding: 9px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--panel); color: var(--text); resize: vertical;
  }
  #draftBox { min-height: 130px; }
  /* 送り先。取り消せない操作の直前に出るので、欄より先に目に入る位置に置く */
  .dest {
    font-size: 11.5px; color: var(--muted); margin: -3px 0 7px;
    padding: 5px 8px; border-left: 2px solid var(--high); background: var(--panel);
    border-radius: 0 4px 4px 0; word-break: break-word;
  }
  .dest b { color: var(--text); }
  .hintline { font-size: 10.5px; color: var(--faint); margin-top: 4px; }

  .act { display: flex; gap: 9px; font-size: 12px; padding: 3px 0; align-items: baseline; }
  .act .ts { color: var(--faint); font-size: 10.5px; flex: none; font-variant-numeric: tabular-nums; }
  .act .k { flex: none; width: 5em; color: var(--faint); font-size: 10.5px; }
  .act.done .k, .act.file .k { color: var(--ok); font-weight: 600; }
  /* 送信は取り消せない。作業ログを流し読みしても目に留まるようにする */
  .act.sent .k { color: var(--high); font-weight: 700; }
  .act.sent { font-weight: 600; }
  .act.error .k, .act.cancelled .k { color: var(--danger); font-weight: 600; }

  .cmt { padding: 7px 0 7px 10px; border-left: 2px solid var(--line); margin-bottom: 8px; }
  .cmt.agent { border-left-color: var(--accent); }
  .cmt .who { font-size: 10.5px; color: var(--faint); margin-bottom: 2px; }
  .cmt .bd { white-space: pre-wrap; word-break: break-word; font-size: 12.5px; }

  .row { display: flex; gap: 7px; align-items: center; flex-wrap: wrap; }
  #toast {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    color: #fff; padding: 8px 16px; border-radius: 6px; z-index: 30; background: var(--muted);
    font-size: 12.5px; box-shadow: 0 4px 14px rgba(0,0,0,.2);
  }
  #toast.ok { background: var(--ok); }
  #toast.err { background: var(--danger); }

  #help {
    position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 40;
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  #help .box {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 20px; max-width: 640px; width: 100%; max-height: 85vh; overflow-y: auto;
  }
  #help h4 { margin: 18px 0 6px; font-size: 12px; color: var(--accent); }
  #help table { border-collapse: collapse; width: 100%; font-size: 12px; }
  #help td { padding: 3px 10px 3px 0; vertical-align: top; }
  #help td:first-child { white-space: nowrap; color: var(--muted); width: 10em; }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<header>
  <h1>通知カンバン</h1>
  <div id="worker" title="ワーカーの状態"><span class="dot"></span><span class="txt">—</span></div>
  <span class="spacer"></span>
  <span id="status" style="font-size:11px;color:var(--faint)" title="最後にボードを読み込んだ時刻">—</span>
  <button id="yoloBtn" class="quiet" title="危険なツールの承認をどう扱うか">自動承認 OFF</button>
  <button id="archBtn" class="quiet">アーカイブ</button>
  <button id="newBtn">+ カード</button>
  <button id="helpBtn" class="quiet" title="表示の意味">?</button>
</header>

<div id="warn" hidden></div>
<div id="perm"></div>
<div id="board"></div>
<div id="drawer" hidden></div>
<div id="toast" hidden></div>
<div id="help" hidden></div>

<script>
(function () {
  'use strict';

  var board = document.getElementById('board');
  var drawer = document.getElementById('drawer');
  var statusEl = document.getElementById('status');
  var toastEl = document.getElementById('toast');
  var workerEl = document.getElementById('worker');
  var helpEl = document.getElementById('help');
  var warnEl = document.getElementById('warn');
  var toastTimer = null;

  var permEl = document.getElementById('perm');
  var lastRev = null, lastPending = 0, dragging = false, openTaskId = null, dirty = false;
  var showArchived = false, workerTaskId = null, workerAlive = false;
  var workerWarn = '', collectorWarn = '';
  // 折りたたみの開閉はカードを開き直しても保つ
  var openSections = {};

  var URGENCY = { high: '高', normal: '中', low: '低' };
  var CATEGORY = {
    reply_required: '返信が必要', task: '作業', fyi: '参考情報',
    spam: '不要', system: 'システム', user: '自分で作成'
  };
  var COLUMN = {
    inbox: '未分類', todo: '要対応', doing: '実行中',
    review: 'レビュー待ち', done: '完了', dismissed: '対応不要', archived: 'アーカイブ済み'
  };
  var COLUMN_HINT = {
    inbox: '判定がまだ', todo: 'ワーカーが次に着手する', doing: 'ワーカーが作業中',
    review: '成果物を確認してください', done: '対応済み', dismissed: '対応不要と判断'
  };
  var ATTENTION = { todo: 1, doing: 1, review: 1 };
  var QUIET = { done: 1, dismissed: 1 };
  // まとめて削除を出す列。片付いた列だけに限る。
  // 未分類・要対応・実行中・レビュー待ちに出すと、まだ見ていないものを一掃できてしまう。
  var SWEEPABLE = { done: 1, dismissed: 1, archived: 1 };
  var ACT_KIND = {
    start: '開始', step: '経過', llm: '検討', tool: '実行', file: '成果物', sent: '送信済み',
    approve: '承認待ち', deny: '不許可', verify: '検証', issue: '指摘', repair: '修正',
    done: '完了', error: 'エラー', cancelled: '中止', user: '操作'
  };
  var WORKER_STATE = {
    working: '作業中', waiting: '承認待ち', idle: '待機中',
    stopped: '停止中', error: 'エラー', unknown: '未起動'
  };
  var TOOL_LABEL = {
    run_command: 'コマンド実行', http_fetch: '外部通信',
    write_file: 'ファイル書き込み', read_file: 'ファイル読み取り', list_files: '一覧取得',
    create_gmail_draft: 'Gmail 下書き作成',
    send_gmail: 'メール送信', send_slack_message: 'Slack へ投稿'
  };
  // 外に出たら取り消せないツール。承認パネルで見分けがつくようにする。
  var IRREVERSIBLE = { send_gmail: 1, send_slack_message: 1 };

  function toast(msg, kind) {
    toastEl.textContent = msg;
    toastEl.className = kind || '';
    toastEl.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.hidden = true; }, 3200);
  }

  function api(path, method, body) {
    return fetch(path, {
      method: method || 'GET',
      headers: body ? { 'Content-Type': 'application/json' } : undefined,
      body: body ? JSON.stringify(body) : undefined
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) {
        return { status: r.status, body: j };
      });
    });
  }

  // 通知本文は第三者が書いた文字列。必ず textContent で入れる。
  // innerHTML を使うとメッセージから DOM を注入できてしまう。
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  // 元の会話へ飛ぶリンク。サーバ側でもスキームを絞っているが、ここでも見る。
  // href に入るのは通知の launch、つまり第三者が決めた文字列なので、
  // javascript: や data: が一段でも通ればボード上でスクリプトが動いてしまう。
  // 表示する文字はサーバが決めたラベルだけで、URL 自体は文面にしない
  // (見えている文字と飛び先が違う、という細工を作らないため)。
  var OPENABLE = /^(https?|mailto|slack|msteams):/i;
  function openLinkEl(link, cls, text) {
    if (!link || !link.url || !OPENABLE.test(link.url)) return null;
    var a = el('a', 'open' + (cls ? ' ' + cls : ''), text || link.label || '元のメッセージを開く');
    a.href = link.url;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.title = link.url;
    return a;
  }

  function actionButton(text, cls, busyText, fn) {
    var b = el('button', cls, text);
    b.onclick = function () {
      b.disabled = true;
      var old = b.textContent;
      b.textContent = busyText;
      Promise.resolve(fn())
        .catch(function (e) { toast('失敗しました: ' + e, 'err'); })
        .then(function () { b.disabled = false; b.textContent = old; });
    };
    return b;
  }

  function hhmm(iso) { return (iso || '').replace('T', ' ').slice(0, 19); }
  function kb(n) { n = Number(n) || 0; return n < 1024 ? n + ' B' : (n / 1024).toFixed(1) + ' KB'; }

  // ---------------------------------------------------------------- ワーカー

  function renderWorker(w) {
    workerTaskId = w && w.currentTaskId ? Number(w.currentTaskId) : null;
    var state = (w && w.state) || 'unknown';
    var msg = (w && w.message) ? w.message : '';
    var stale = w && w.staleSeconds != null && w.staleSeconds > 90;

    // 生きていると名乗っていてもハートビートが止まっていれば動いていない。
    // idle のまま固まると「待機中」に見え、なぜ着手されないか分からなくなる。
    // waiting は承認待ちで意図的に止まっている状態。落ちたのとは区別する。
    var claimsAlive = (state === 'working' || state === 'idle' || state === 'waiting');
    if (stale && claimsAlive) {
      msg = (state === 'idle' ? '' : '作業中に落ちました。')
          + Math.floor(w.staleSeconds / 60) + '分以上応答がありません（プロセスが動いていません）';
      state = 'stopped';
      workerTaskId = null;
      claimsAlive = false;
    }
    workerAlive = claimsAlive;

    workerEl.className = state;
    var label = WORKER_STATE[state] || state;
    var txt = label + (msg && msg !== label ? '： ' + msg : '');
    if (state === 'working' && workerTaskId) txt += '（#' + workerTaskId + '）';
    workerEl.querySelector('.txt').textContent = 'ワーカー ' + txt;
    workerEl.title = 'ワーカー: ' + label + (msg ? '\n' + msg : '');

    workerWarn = workerAlive ? ''
      : 'ワーカーが動いていないため、「要対応」のカードには誰も着手しません。'
        + ' phase4\\Start-Worker.ps1 を起動してください。';
    renderWarnings();
  }

  // ---------------------------------------------------------------- 収集

  // 収集が止まっていると、メールが届いてもカードは1枚も増えない。
  // 「要対応が無い」のと見分けが付かないので、止まっていることを明示する。
  function renderCollector(c) {
    var state = (c && c.state) || 'never';
    // トリアージは1件ずつ LLM を呼ぶので数分かかることがある。
    // 動いているものを「止まった」と言わないよう、しきい値は長めに取る。
    var stale = c && c.staleSeconds != null && c.staleSeconds > 900;

    if (state === 'never') {
      collectorWarn = 'メールと通知の取り込みが一度も動いていません。'
        + ' Start-Collector.ps1 を起動してください（これが無いとカードは作られません）。';
    } else if (state === 'stopped' || stale) {
      collectorWarn = '取り込みが止まっています'
        + (stale && c.staleSeconds != null ? '（最終 ' + Math.floor(c.staleSeconds / 60) + '分前）' : '')
        + '。新しいメールや通知はカードになりません。Start-Collector.ps1 を起動してください。';
    } else if (state === 'error') {
      // 動いてはいるが取り込めていない。放っておくと静かに漏れ続ける。
      collectorWarn = '取り込みが失敗しています： ' + (c.message || '原因不明')
        + '（収集は動き続けています）';
    } else {
      collectorWarn = '';
    }
    renderWarnings();
  }

  function renderWarnings() {
    var msgs = [collectorWarn, workerWarn].filter(Boolean);
    warnEl.innerHTML = '';
    msgs.forEach(function (m) { warnEl.appendChild(el('div', '', m)); });
    warnEl.hidden = msgs.length === 0;
  }

  // ---------------------------------------------------------------- 承認

  function renderApprovals(d) {
    permEl.innerHTML = '';
    var yolo = !!d.yolo;
    var yb = document.getElementById('yoloBtn');
    yb.textContent = yolo ? '自動承認 ON' : '自動承認 OFF';
    yb.className = yolo ? 'on' : 'quiet';
    yb.title = yolo
      ? 'すべてのツール実行が承認なしで通ります。押すと確認ありに戻します。'
      : '危険なツールは実行前に確認します。押すとすべて自動承認にします。';

    (d.pending || []).forEach(function (p) {
      var box = el('div', 'ask');
      box.appendChild(el('div', 'hd', '実行の確認: ' + (TOOL_LABEL[p.tool] || p.tool)
        + (IRREVERSIBLE[p.tool] ? '（取り消せません）' : '')));
      box.appendChild(el('div', 'sub', 'カード #' + p.task_id + ' · ' + p.summary + ' · ワーカーは応答があるまで止まっています'));
      // 実行内容は省略せず出す。ここが注入と実行のあいだの唯一の壁になる。
      box.appendChild(el('pre', null, p.detail));

      var row = el('div', 'row');
      function decide(label, busy, decision, grant, cls) {
        row.appendChild(actionButton(label, cls, busy, function () {
          return api('/api/approvals/' + p.id + '/decide', 'POST', { decision: decision, grant: grant })
            .then(function (r) {
              if (r.status === 409) toast('すでに処理済みでした', 'err');
              else toast(decision === 'approved' ? '許可しました' : '拒否しました', 'ok');
              return refresh(true);
            });
        }));
      }
      decide('許可', '許可中…', 'approved', null, 'primary');
      decide('このカードでは以後許可', '設定中…', 'approved', 'task', null);
      decide('今後すべて許可', '設定中…', 'approved', 'global', null);
      decide('拒否', '拒否中…', 'denied', null, 'danger');
      box.appendChild(row);
      permEl.appendChild(box);
    });

    if ((d.grants || []).length > 0) {
      var g = el('div', 'grants');
      g.appendChild(el('span', null, '許可済み:'));
      d.grants.forEach(function (x) {
        var chip = el('span', 'g');
        chip.appendChild(el('span', null,
          (TOOL_LABEL[x.tool] || x.tool) + '（' + (x.scope === 'global' ? '全体' : 'カード #' + x.scope_id) + '）'));
        var rm = el('button', null, '×');
        rm.title = 'この許可を取り消す';
        rm.onclick = function () {
          api('/api/grants/' + x.id, 'DELETE').then(function () {
            toast('許可を取り消しました', 'ok');
            refresh(true);
          });
        };
        chip.appendChild(rm);
        g.appendChild(chip);
      });
      permEl.appendChild(g);
    }
  }

  function loadApprovals() {
    return api('/api/approvals').then(function (r) { renderApprovals(r.body); });
  }

  // ---------------------------------------------------------------- ボード

  function renderBoard(data) {
    board.innerHTML = '';
    renderWorker(data.worker);
    renderCollector(data.collector);
    data.columns.forEach(function (col) {
      var c = el('div', 'col' + (ATTENTION[col.key] ? ' act' : '') + (QUIET[col.key] ? ' done-ish' : ''));
      var head = el('div', 'head');
      var top = el('div', 'top');
      var name = el('div', 'name', (COLUMN[col.key] || col.label) + ' ');
      name.appendChild(el('span', 'count', String(col.tasks.length)));
      top.appendChild(name);
      if (SWEEPABLE[col.key] && col.tasks.length > 0) top.appendChild(sweepButton(col));
      head.appendChild(top);
      if (COLUMN_HINT[col.key]) head.appendChild(el('span', 'hint', COLUMN_HINT[col.key]));
      c.appendChild(head);

      var list = el('div', 'list');
      col.tasks.forEach(function (t) { list.appendChild(renderCard(t, col.key)); });
      c.appendChild(list);

      if (col.key !== 'archived') {
        c.addEventListener('dragover', function (ev) { ev.preventDefault(); c.classList.add('over'); });
        c.addEventListener('dragleave', function () { c.classList.remove('over'); });
        c.addEventListener('drop', function (ev) {
          ev.preventDefault();
          c.classList.remove('over');
          var raw = ev.dataTransfer.getData('text/plain');
          if (!raw) return;
          var d = JSON.parse(raw);
          if (d.from === col.key) return;
          move(d.id, d.version, d.from, col.key);
        });
      }
      board.appendChild(c);
    });
  }

  // 列のカードをまとめて消す。1枚ずつ開いて削除するのが面倒な「完了」「対応不要」向け。
  // 送るのはいま画面に出ている id だけ。サーバ側でも列を確かめ直すので、
  // 押した拍子に入ってきたカードは巻き込まれない。
  function sweepButton(col) {
    var label = COLUMN[col.key] || col.label;
    var ids = col.tasks.map(function (t) { return Number(t.id); });
    return actionButton('まとめて削除', 'sweep', '削除中…', function () {
      if (!confirm('「' + label + '」の ' + ids.length + ' 枚を完全に削除します。\n'
        + '作業ログとやりとりも消え、元に戻せません。')) return;
      return api('/api/tasks/bulk-delete', 'POST', { column: col.key, ids: ids }).then(function (r) {
        // 応答を見てからでないと、失敗しているのに消えたと表示してしまう。
        if (r.status !== 200 || r.body.ok === false) {
          toast('削除できませんでした: ' + (r.body.error || r.status), 'err');
          return refresh(true);
        }
        toast(r.body.deleted + ' 枚を削除しました'
          + (r.body.skipped ? '（' + r.body.skipped + ' 枚は他で更新されたため残しました）' : ''), 'ok');
        // 消したカードを開いたままにしない
        if (openTaskId && ids.indexOf(Number(openTaskId)) >= 0) {
          openTaskId = null; dirty = false; drawer.hidden = true;
        }
        return refresh(true);
      });
    });
  }

  function renderCard(t, colKey) {
    var running = Number(t.id) === workerTaskId;
    var card = el('div', 'card' + (t.urgency ? ' u-' + t.urgency : '') + (running ? ' active' : ''));
    card.draggable = (colKey !== 'archived');

    card.appendChild(el('div', 't', t.title));
    if (t.summary) card.appendChild(el('div', 's', t.summary));

    // 補助情報は小さく淡く一行に。強調するのは緊急度「高」と警告だけ。
    var foot = el('div', 'foot');
    foot.appendChild(el('span', null, '#' + t.id));
    if (t.urgency === 'high') foot.appendChild(el('span', 'u-high', '緊急度 高'));
    if (t.artifact_count > 0) foot.appendChild(el('span', 'files', '成果物 ' + t.artifact_count));
    if (t.cancel_requested) {
      // 要対応にあるのに中止要求が残っていると、ワーカーは永久に飛ばす
      var w = el('span', 'warnflag', colKey === 'todo' ? '着手対象外' : '中止要求');
      w.title = colKey === 'todo'
        ? '中止要求が残っているためワーカーが飛ばします。カードを開いて解除できます'
        : 'ワーカーは次の区切りで作業をやめます';
      foot.appendChild(w);
    }
    var open = openLinkEl(t.open_link, null, '元を開く ↗');
    if (open) {
      // カードのクリックはドロワーを開く。リンクだけは通さない。
      open.addEventListener('click', function (ev) { ev.stopPropagation(); });
      open.draggable = false;
      foot.appendChild(open);
    }
    card.appendChild(foot);
    if (running) card.appendChild(el('div', 'now', '● ワーカーが作業中'));

    card.addEventListener('dragstart', function (ev) {
      dragging = true;
      ev.dataTransfer.setData('text/plain', JSON.stringify({ id: t.id, version: t.version, from: colKey }));
    });
    card.addEventListener('dragend', function () { dragging = false; });
    card.addEventListener('click', function () { openDetail(t.id); });
    return card;
  }

  function move(id, version, from, to) {
    return api('/api/tasks/' + id + '/move', 'POST', { column: to, version: version, from: from })
      .then(function (r) {
        if (r.status === 409) toast('他で更新されていたため移動しませんでした', 'err');
        else if (from === 'doing' && to !== 'doing') toast('移動し、ワーカーに中止を要求しました', 'ok');
        else toast('「' + (COLUMN[to] || to) + '」へ移動しました', 'ok');
        return refresh(true);
      });
  }

  function drawerBusy() {
    var a = document.activeElement;
    return dirty || (a && drawer.contains(a) && !drawer.hidden);
  }

  function closeDrawer(force) {
    if (drawer.hidden) return;
    // 未保存の編集を黙って捨てない
    if (!force && dirty && !confirm('保存していない編集があります。閉じてよいですか？')) return;
    openTaskId = null;
    dirty = false;
    drawer.hidden = true;
  }

  function refresh(force) {
    return api('/api/board' + (showArchived ? '?archived=1' : '')).then(function (r) {
      lastRev = r.body.rev;
      renderBoard(r.body);
      statusEl.textContent = new Date().toLocaleTimeString();
      if (openTaskId && (force || !drawerBusy())) openDetail(openTaskId, true);
      return loadApprovals();
    });
  }

  function poll() {
    if (dragging) return;
    api('/api/rev').then(function (r) {
      // 版はハートビートでは変わらないので、死活はここで毎回描き直す
      if (r.body.worker) renderWorker(r.body.worker);
      if (r.body.collector) renderCollector(r.body.collector);
      if (r.body.rev && r.body.rev !== lastRev) refresh(false);
      else if (r.body.pending !== lastPending) { lastPending = r.body.pending; loadApprovals(); }
      lastPending = r.body.pending;
    }).catch(function () { statusEl.textContent = '接続なし'; });
  }

  // ---------------------------------------------------------------- 詳細

  // 既定で閉じている折りたたみ。開閉状態は openSections に覚える。
  function foldable(key, label, count, buildBody) {
    var d = document.createElement('details');
    d.open = !!openSections[key];
    var s = document.createElement('summary');
    s.appendChild(el('span', null, label));
    if (count != null) s.appendChild(el('span', 'n', '（' + count + '）'));
    d.appendChild(s);
    var body = el('div', 'body');
    d.appendChild(body);
    var built = false;
    function build() { if (!built) { buildBody(body); built = true; } }
    if (d.open) build();
    d.addEventListener('toggle', function () {
      openSections[key] = d.open;
      if (d.open) build();
    });
    return d;
  }

  function pre(text) { return el('pre', null, text); }

  function openDetail(id, keepScroll) {
    return api('/api/tasks/' + id).then(function (r) {
      if (r.status !== 200) return;
      openTaskId = id;
      var t = r.body.task, ev = r.body.event, openLink = r.body.openLink, outlet = r.body.outlet;
      var comments = r.body.comments || [], activity = r.body.activity || [], files = r.body.artifacts || [];
      var scroll = keepScroll ? drawer.scrollTop : 0;

      drawer.innerHTML = '';
      var pad = el('div', 'pad');
      drawer.appendChild(pad);

      var head = el('div', 'row');
      head.appendChild(el('h3', null, t.title));
      var sp = el('span'); sp.style.flex = '1'; head.appendChild(sp);
      // 元の会話は折りたたみの中ではなく見出しの隣に置く。
      // 「相手の言い分を確かめる」のはカードを開いた直後にやることなので、
      // 一番下まで開かないと辿り着けないのでは導線として遅い。
      var openBtn = openLinkEl(openLink, 'btn');
      if (openBtn) head.appendChild(openBtn);
      var close = el('button', 'quiet', '閉じる');
      close.onclick = function () { closeDrawer(); };
      head.appendChild(close);
      pad.appendChild(head);

      var chips = el('div', 'chips');
      function chip(label, value, cls, tip) {
        var c = el('span', 'chip' + (cls ? ' ' + cls : ''));
        if (label) c.appendChild(document.createTextNode(label + ' '));
        c.appendChild(el('b', null, value));
        if (tip) c.title = tip;
        chips.appendChild(c);
      }
      chip('', '#' + t.id, null, 'カード番号');
      chip('列', COLUMN[t.board_column] || t.board_column, null, 'いまカンバンのどこにあるか');
      if (t.urgency) chip('緊急度', URGENCY[t.urgency] || t.urgency, t.urgency === 'high' ? 'hi' : null, '対応の急ぎ度合い');
      if (t.category) chip('種別', CATEGORY[t.category] || t.category, null, '通知の分類');
      chip('版', t.version, null, '更新のたびに増える番号。同時編集の衝突検出に使う');
      if (t.cancel_requested) {
        var w = el('span', 'chip warn', '中止要求あり'); w.title = 'ワーカーはこのカードを飛ばします'; chips.appendChild(w);
      }
      if (t.archived_at) chips.appendChild(el('span', 'chip warn', 'アーカイブ済み'));
      pad.appendChild(chips);

      if (t.summary) pad.appendChild(el('div', 'lead', t.summary));

      // --- 主役1: 成果物 ---
      if (files.length > 0) {
        var box = el('div', 'primary');
        box.appendChild(el('div', 'cap', 'ワーカーが作成したファイル'));
        files.forEach(function (f) {
          var row = el('div', 'file');
          row.appendChild(el('span', 'nm', f.name));
          row.appendChild(el('span', 'sz', kb(f.bytes)));
          row.appendChild(actionButton('中身を見る', null, '読込中…', function () {
            return api('/api/tasks/' + t.id + '/artifact?id=' + f.id).then(function (a) {
              if (a.status !== 200) { toast('ファイルを開けませんでした', 'err'); return; }
              var v = document.getElementById('view-' + f.id);
              if (v) { v.hidden = !v.hidden; return; }
              var p = pre(a.body.content);
              p.id = 'view-' + f.id;
              p.style.marginTop = '6px';
              row.parentNode.insertBefore(p, row.nextSibling);
            });
          }));
          box.appendChild(row);
        });
        box.appendChild(el('div', 'hintline',
          'ファイルはカードごとの作業フォルダに保存されています。.eml はメールソフトで開くと下書きになります。'));
        pad.appendChild(box);
      }

      // --- 主役2: このカードの出口 ---
      // 送り先があるカードは「送る文面」、無いカードは「対応の記録」。
      // どちらも、書いた内容がカードを閉じる操作に直結する。
      // 保存しても何も起きない欄にはしない。
      var sendable = outlet && outlet.kind !== 'none';
      var edit = el('div', 'primary');
      edit.appendChild(el('div', 'cap', sendable ? '送る文面' : '対応の記録'));
      if (sendable) {
        var dest = el('div', 'dest');
        dest.appendChild(el('b', null, outlet.label));
        dest.appendChild(document.createTextNode(' — この欄の内容がそのまま送られます'));
        edit.appendChild(dest);
      }
      var ta = document.createElement('textarea');
      ta.id = 'draftBox';
      // ワーカーの提案 (draft_text) は下敷き。自分が直した版があればそちらが優先。
      // 再実行しても user_edited は上書きされない。
      ta.value = t.user_edited || t.draft_text || '';
      ta.placeholder = sendable
        ? '送る本文。ここに書いた内容はワーカーが再実行しても消えません。'
        : 'やったこと・決めたことを残す（空のままでも完了にできます）。';
      ta.oninput = function () { dirty = true; };
      edit.appendChild(ta);
      if (sendable && !t.user_edited && t.draft_text) {
        edit.appendChild(el('div', 'hintline', 'ワーカーが用意した文面です。保存するか送ると、あなたの版として確定します。'));
      }

      var er = el('div', 'row'); er.style.marginTop = '7px';
      // 主役は出口のボタン（送る / 完了にする）。保存は「まだ閉じない」ときの逃げ道なので沈める。
      er.appendChild(actionButton('保存', null, '保存中…', function () {
        return api('/api/tasks/' + t.id, 'PATCH', { user_edited: ta.value, version: t.version })
          .then(function (r2) {
            if (r2.status === 409) toast('他で更新されていたため保存できませんでした', 'err');
            else toast('保存しました', 'ok');
            dirty = false;
            return refresh(true);
          });
      }));

      if (sendable) {
        // 取り消せない操作。宛先と全文を出してから確認を取る。
        // 宛先はここで決めず、サーバがカードの元イベントから決める。
        er.appendChild(actionButton('この内容で送る', 'primary', '送信中…', function () {
          var body = ta.value;
          if (!body.trim()) { toast('本文が空です', 'err'); return; }
          if (!confirm('次の内容を送信します。取り消せません。\n\n宛先: ' + outlet.label
            + '\n\n--- 本文 ---\n' + body)) return;
          return api('/api/tasks/' + t.id + '/send', 'POST',
              { text: body, version: t.version, confirm: true })
            .then(function (r2) {
              if (r2.status === 409) { toast('他で更新されていたため送信しませんでした', 'err'); return refresh(true); }
              if (r2.status !== 200 || r2.body.ok === false) {
                toast('送信できませんでした: ' + (r2.body.error || r2.status), 'err');
                return refresh(true);
              }
              dirty = false;
              toast('送信しました（' + r2.body.to + '）。完了に移しました', 'ok');
              return refresh(true);
            });
        }));
      } else {
        er.appendChild(actionButton('これで完了にする', 'primary', '処理中…', function () {
          return api('/api/tasks/' + t.id + '/done', 'POST', { text: ta.value, version: t.version })
            .then(function (r2) {
              if (r2.status === 409) { toast('他で更新されていたため完了にできませんでした', 'err'); return refresh(true); }
              dirty = false;
              toast('完了にしました', 'ok');
              return refresh(true);
            });
        }));
      }

      if (t.agent_output) {
        er.appendChild(actionButton('報告を取り込む', null, '…', function () {
          ta.value = t.agent_output; dirty = true;
          toast('編集欄に入れました。保存すると確定します', 'ok');
        }));
      }
      if (t.cancel_requested) {
        er.appendChild(actionButton('中止を解除して要対応へ', null, '解除中…', function () {
          return api('/api/tasks/' + t.id + '/cancel', 'POST', { cancel: false })
            .then(function () { return api('/api/tasks/' + t.id + '/move', 'POST', { column: 'todo', from: t.board_column }); })
            .then(function () { toast('要対応に戻しました', 'ok'); return refresh(true); });
        }));
      } else {
        er.appendChild(actionButton('作業を中止', 'danger', '中止要求中…', function () {
          return api('/api/tasks/' + t.id + '/cancel', 'POST', {}).then(function () {
            toast('中止を要求しました', 'ok');
            return refresh(true);
          });
        }));
      }
      edit.appendChild(er);
      pad.appendChild(edit);

      // --- 以下は既定で折りたたむ ---
      if (t.agent_output) {
        pad.appendChild(foldable('report', 'ワーカーの報告', null, function (b) { b.appendChild(pre(t.agent_output)); }));
      }
      if (t.reason) {
        pad.appendChild(foldable('reason', 'この判定にした理由', null, function (b) { b.appendChild(pre(t.reason)); }));
      }

      pad.appendChild(foldable('activity', 'ワーカーの作業ログ', activity.length, function (b) {
        if (activity.length === 0) { b.appendChild(el('div', 'act', 'まだ作業は行われていません')); return; }
        activity.slice().reverse().forEach(function (a) {
          var row = el('div', 'act ' + a.kind);
          row.appendChild(el('span', 'ts', hhmm(a.created_at).slice(11)));
          row.appendChild(el('span', 'k', ACT_KIND[a.kind] || a.kind));
          row.appendChild(el('span', null, a.message));
          b.appendChild(row);
        });
      }));

      pad.appendChild(foldable('comments', '指示・やりとり', comments.length, function (b) {
        // 入力欄を先頭に、やりとりは新しい順。増えても入力とその直前の文脈が
        // 常に手前にあり、下までスクロールする必要がない。
        var ci = document.createElement('textarea');
        ci.rows = 3;
        ci.placeholder = 'ワーカーへの指示（改行できます／Ctrl+Enter で送信）';
        var send = function () {
          if (!ci.value.trim()) return;
          return api('/api/tasks/' + t.id + '/comment', 'POST', { body: ci.value })
            .then(function () {
              ci.value = '';
              toast('指示を送りました。次の実行時に反映されます', 'ok');
              openSections['comments'] = true;
              return refresh(true);
            })
            .then(function () {
              var next = drawer.querySelector('details .body textarea');
              if (next) next.focus();
            });
        };
        ci.onkeydown = function (e) {
          if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); send(); }
        };
        b.appendChild(ci);
        var sr = el('div', 'row'); sr.style.margin = '6px 0 12px';
        sr.appendChild(actionButton('指示を送る', null, '送信中…', send));
        b.appendChild(sr);

        comments.slice().reverse().forEach(function (c) {
          var d = el('div', 'cmt' + (c.author === 'agent' ? ' agent' : ''));
          d.appendChild(el('div', 'who', (c.author === 'user' ? '自分' : 'ワーカー') + ' · ' + hhmm(c.created_at)));
          d.appendChild(el('div', 'bd', c.body));
          b.appendChild(d);
        });
      }));

      if (ev) {
        pad.appendChild(foldable('event', '元の通知', null, function (b) {
          b.appendChild(pre((ev.app_id || '') + '\n' + hhmm(ev.occurred_at)));
          if (ev.body) b.appendChild(pre(ev.body));
          var a2 = openLinkEl(openLink, 'btn');
          if (a2) b.appendChild(a2);
          if (ev.link) {
            // 飛び先そのものは文字列として別に出す。開く前に確かめられるように。
            var raw = el('div', null, ev.link);
            raw.style.cssText = 'color:var(--faint);word-break:break-all;font-size:11px;margin-top:6px';
            b.appendChild(raw);
          }
        }));
      }

      pad.appendChild(foldable('manage', 'カードの片付け', null, function (b) {
        var mng = el('div', 'row');
        mng.appendChild(actionButton(t.archived_at ? 'アーカイブから戻す' : 'アーカイブ', null, '処理中…', function () {
          return api('/api/tasks/' + t.id + '/archive', 'POST', { archived: !t.archived_at })
            .then(function () {
              toast(t.archived_at ? 'ボードに戻しました' : 'アーカイブしました', 'ok');
              if (!t.archived_at && !showArchived) { openTaskId = null; drawer.hidden = true; }
              return refresh(true);
            });
        }));
        mng.appendChild(actionButton('削除', 'danger', '削除中…', function () {
          if (!confirm('カード #' + t.id + '「' + t.title + '」を完全に削除します。\n作業ログとやりとりも消え、元に戻せません。')) return;
          return api('/api/tasks/' + t.id, 'DELETE').then(function (r) {
            // 応答を見ずに成功を名乗らない。失敗しているのに消えたと表示すると原因が分からなくなる。
            if (r.status !== 200 || r.body.ok === false) {
              toast('削除できませんでした: ' + (r.body.error || r.status), 'err');
              return refresh(true);
            }
            toast('削除しました', 'ok');
            openTaskId = null; dirty = false; drawer.hidden = true;
            return refresh(true);
          });
        }));
        b.appendChild(mng);
        b.appendChild(el('div', 'hintline', '削除してもワーカーが作ったファイル自体は作業フォルダに残ります。'));
      }));

      drawer.hidden = false;
      drawer.scrollTop = scroll;
    });
  }

  // ---------------------------------------------------------------- ヘルプ

  function rows(pairs) {
    var tb = document.createElement('table');
    pairs.forEach(function (p) {
      var tr = document.createElement('tr');
      tr.appendChild(el('td', null, p[0]));
      tr.appendChild(el('td', null, p[1]));
      tb.appendChild(tr);
    });
    return tb;
  }

  function openHelp() {
    helpEl.innerHTML = '';
    var box = el('div', 'box');
    var head = el('div', 'row');
    head.appendChild(el('h3', null, '表示の意味'));
    var sp = el('span'); sp.style.flex = '1'; head.appendChild(sp);
    var c = el('button', 'quiet', '閉じる');
    c.onclick = function () { helpEl.hidden = true; };
    head.appendChild(c);
    box.appendChild(head);

    box.appendChild(el('h4', null, '列'));
    box.appendChild(rows([
      ['未分類', '判定がまだのカード'],
      ['要対応', 'ワーカーが次に着手する'],
      ['実行中', 'ワーカーが作業している。ここから動かすと中止要求になる'],
      ['レビュー待ち', '成果物ができた状態。内容を確認して送信可否を決める'],
      ['完了 / 対応不要', '済んだもの。淡く表示される'],
      ['まとめて削除', '完了・対応不要・アーカイブ済みの見出しに出る。その列のカードを全部消す']
    ]));

    box.appendChild(el('h4', null, 'カードの表示'));
    box.appendChild(rows([
      ['左の色帯', '緊急度。赤=高、青=中、灰=低'],
      ['#1', 'カード番号。ワーカーの作業ログと照合するときに使う'],
      ['成果物 n', 'ワーカーが実際に作ったファイルの数'],
      ['元を開く ↗', '元のメッセージを別タブで開く。Slack は補完済みなら permalink、それ以外は通知のリンク'],
      ['送る文面', '返信先があるカードで出る。この欄の内容がそのまま送られる。宛先はカードの元通知から決まり、変更できない'],
      ['対応の記録', '返信先が無いカードで出る。「これで完了にする」で保存して完了に移る。空でもよい'],
      ['着手対象外', '中止要求が残っており、ワーカーが飛ばす'],
      ['版', '更新のたびに増える番号。同時編集の衝突検出に使う']
    ]));

    box.appendChild(el('h4', null, 'ワーカー'));
    box.appendChild(rows([
      ['承認なしで実行', 'カードの作業フォルダ内でのファイル作成・読み取り、メール下書き(.eml)の作成'],
      ['承認が必要', 'コマンド実行、外部への通信、作業フォルダ外への書き込み・読み取り、Gmail 下書きの作成'],
      ['取り消せない', 'メール送信と Slack への投稿。承認画面に宛先と本文が全文出る。既定は下書きまでで、送信は指示したときだけ'],
      ['作業中 / 承認待ち', 'ヘッダに対象カードと内容が出る'],
      ['停止中 / 未起動', 'phase4\\Start-Worker.ps1 を実行すると動き出す']
    ]));

    box.appendChild(el('h4', null, '承認'));
    box.appendChild(rows([
      ['許可 / 拒否', 'その1回だけの判断。拒否した場合ワーカーには理由が伝わり、別の手を考える'],
      ['このカードでは以後許可', 'そのカードに限り、同じ種類のツールを確認なしにする'],
      ['今後すべて許可', 'すべてのカードで、その種類のツールを確認なしにする'],
      ['許可済み', 'ヘッダ下に一覧が出る。× で取り消せる'],
      ['自動承認 ON', 'いわゆる YOLO。すべて確認なし。通知本文に混ぜられた指示も素通りする'],
      ['注意', '承認画面は実行内容を省略せず表示する。コマンドや URL は必ず読むこと']
    ]));

    box.appendChild(el('h4', null, '自己検証'));
    box.appendChild(rows([
      ['何をするか', '作成後に別の会話で成果物を点検する。途中終了・空欄・依頼との食い違いを見る'],
      ['要修正なら', '指摘をワーカーに戻して直させ、再度検証する'],
      ['送信済みなら', '直しには回さない。送ったものは取り消せず、二通目が出かねないため。指摘はコメントに残る'],
      ['残った指摘', 'カードのコメントに残り、報告にも「要確認」と出る']
    ]));
    helpEl.appendChild(box);
    helpEl.hidden = false;
  }

  // ---------------------------------------------------------------- 起動

  document.getElementById('yoloBtn').onclick = function () {
    var turningOn = (this.className !== 'on');
    if (turningOn && !confirm(
      'すべてのツール実行を承認なしで通します。\n\n'
      + 'コマンド実行・外部通信・作業フォルダ外への書き込みも確認なしで実行されます。\n'
      + '通知やメールの本文に混ぜ込まれた指示がそのまま実行される可能性があります。\n\n'
      + '有効にしますか？')) return;
    api('/api/settings/yolo', 'POST', { on: turningOn }).then(function () {
      toast(turningOn ? '自動承認を有効にしました' : '確認ありに戻しました', turningOn ? 'err' : 'ok');
      refresh(true);
    });
  };

  document.getElementById('helpBtn').onclick = openHelp;
  helpEl.onclick = function (e) { if (e.target === helpEl) helpEl.hidden = true; };
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (!helpEl.hidden) { helpEl.hidden = true; return; }
    closeDrawer();
  });

  // パネルの外をクリックしたら閉じる。
  // カードは openDetail が拾って別のカードに切り替えるので、ここでは閉じない。
  document.addEventListener('mousedown', function (e) {
    if (drawer.hidden || !helpEl.hidden) return;
    if (drawer.contains(e.target)) return;
    if (e.target.closest && e.target.closest('.card')) return;
    closeDrawer();
  });

  document.getElementById('archBtn').onclick = function () {
    showArchived = !showArchived;
    this.textContent = showArchived ? 'ボードに戻る' : 'アーカイブ';
    refresh(true);
  };

  document.getElementById('newBtn').onclick = function () {
    var title = prompt('カードのタイトル');
    if (!title) return;
    api('/api/tasks', 'POST', { title: title }).then(function () {
      toast('カードを作成しました', 'ok');
      refresh(true);
    });
  };

  refresh(true);
  setInterval(poll, 1500);
})();
</script>
</body>
</html>
